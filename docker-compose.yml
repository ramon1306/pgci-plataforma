version: '3.8'

services:
  # 1. Base de Datos (PostgreSQL)
  db:
    image: postgres:15
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=pgci_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password_seguro
    networks:
      - pgci_network

  # 2. El motor (Django + Gunicorn)
  backend:
    build: ./backend
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn pgci_api.wsgi:application --bind 0.0.0.0:8000 --workers 1 --timeout 120"
    volumes:
      - ./backend/static:/app/static
      - ./backend/media:/app/media
    expose:
      - "8000"
    environment:
      - DJANGO_SETTINGS_MODULE=pgci_api.settings_prod
      - DATABASE_URL=postgres://admin:password_seguro@db:5432/pgci_db
    depends_on:
      - db
    networks:
      - pgci_network

  # 3. La carrocería (Nginx - Servidor Web)
  nginx:
    image: nginx:stable-alpine
    container_name: frontend-nginx-1
    restart: always
    volumes:
      # Configuración de Nginx
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      
      # Frontend: Mapeo de la carpeta build a la ruta estándar de Nginx
      - /var/www/frontend/frontend/build:/usr/share/nginx/html:ro
      
      # Estáticos del Backend (deben coincidir con los alias en default.conf)
      - ./backend/static:/app/static:ro
      - ./backend/media:/app/media:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - pgci_network

networks:
  pgci_network:
    driver: bridge

volumes:
  postgres_data: