server {
    listen 80;
    server_name 104.236.113.179;

    # 1. Frontend y Estáticos del Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Estáticos (Cambiamos 'alias' por 'root' para evitar el error de los logs)
    location /static/ {
        # Buscamos primero en el front, si no está, Nginx lo busca en el backend
        root /usr/share/nginx/html;
        try_files $uri /app/static$uri =404;
    }

    # 3. Backend API
    location /api/v1/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Django Admin
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 5. Media
    location /media/ {
        alias /app/media/;
    }
}